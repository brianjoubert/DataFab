name: Build DataFab (Windows .exe + Linux .deb)

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # needed to attach files to a GitHub Release on tags

env:
  PYTHONIOENCODING: utf-8
  QT_QPA_PLATFORM: offscreen   # headless Qt for tests and smoke tests

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies (from uv.lock)
        run: uv sync --locked --group build

      - name: Run tests
        run: uv run --locked pytest -v

      - name: Render icons
        run: uv run --locked python tools/make_icons.py

      - name: Build DataFab.exe
        run: uv run --locked pyinstaller --noconfirm --clean DataFab.spec

      - name: Smoke-test DataFab.exe
        shell: pwsh
        run: |
          $demo = Join-Path $env:RUNNER_TEMP "demo"
          uv run --locked python tools/make_demo.py $demo
          $cfg = Get-Content "$demo/demo.json" | ConvertFrom-Json
          $cfg.script_parameters.export_gds_with_text = $true
          $cfg | ConvertTo-Json -Depth 10 | Set-Content "$demo/demo.json" -Encoding utf8
          $p = Start-Process dist/DataFab.exe -ArgumentList "--generate","`"$demo/demo.json`"" -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw "--generate failed ($($p.ExitCode))" }
          if (-not (Test-Path "$demo/demo_layout_with_text.gds")) { throw "labelled GDS missing" }
          $p = Start-Process dist/DataFab.exe -ArgumentList "`"$demo/demo_database.json`"","--simulate","--self-test" -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw "self-test failed ($($p.ExitCode))" }
          "{0:N1} MB" -f ((Get-Item dist/DataFab.exe).Length / 1MB)

      - uses: actions/upload-artifact@v4
        with:
          name: DataFab-windows
          path: dist/DataFab.exe
          retention-days: 30

  linux:
    runs-on: ubuntu-22.04   # oldest supported target (glibc 2.35); the .deb works on newer too
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: System libraries for Qt
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgl1 libegl1 libfontconfig1 libxkbcommon0 \
            libxkbcommon-x11-0 libdbus-1-3 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xkb1 libusb-1.0-0 \
            fonts-dejavu-core

      - name: Install dependencies (from uv.lock)
        run: uv sync --locked --group build

      - name: Run tests
        run: uv run --locked pytest -v

      - name: Render icons
        run: uv run --locked python tools/make_icons.py

      - name: Build (PyInstaller one-folder)
        run: uv run --locked pyinstaller --noconfirm --clean DataFab.spec

      - name: Package .deb
        run: |
          VERSION=$(uv run --locked python -c "from version import __version__; print(__version__)")
          if [[ "$GITHUB_REF" != refs/tags/v* ]]; then VERSION="${VERSION}~git$(git rev-parse --short HEAD)"; fi
          bash packaging/linux/build_deb.sh "$VERSION"
          dpkg-deb --info dist/datafab_*_amd64.deb
          ls -lh dist/*.deb

      - name: Install the .deb and smoke-test it
        run: |
          sudo apt-get install -y ./dist/datafab_*_amd64.deb
          which datafab
          datafab --version
          uv run --locked python tools/make_demo.py "$RUNNER_TEMP/demo"
          datafab --generate "$RUNNER_TEMP/demo/demo.json"
          datafab "$RUNNER_TEMP/demo/demo_database.json" --simulate --self-test
          test -f /usr/share/applications/datafab.desktop
          test -f /usr/lib/udev/rules.d/60-datafab-keithley.rules

      - uses: actions/upload-artifact@v4
        with:
          name: DataFab-linux-deb
          path: dist/*.deb
          retention-days: 30

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Check tag matches version.py
        run: |
          V=$(python3 -c "from version import __version__; print(__version__)")
          [ "v$V" = "$GITHUB_REF_NAME" ] || { echo "Tag $GITHUB_REF_NAME != version.py $V"; exit 1; }
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/DataFab.exe
            artifacts/*.deb
          generate_release_notes: true
