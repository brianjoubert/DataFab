[project]
name = "datafaf"
version = "0.1.0"
description = "Wafer/die database generator (GDS -> JSON) and resistance viewer with Keithley 2450 live measurement"
readme = "README.md"
requires-python = ">=3.12"

# Direct runtime deps inferred from your scripts
dependencies = [
  "numpy",
  "pandas",
  "plotly",
  "dash",
  "dash-bootstrap-components",
  "shapely",
  "gdsfactory",
  "klayout",                      # provides the `klayout.db` module (imported as `pya`)
  "pyvisa",
  "pyvisa-py",
  "pyserial",
]

[dependency-groups]
# `uv sync` installs "dev" by default; add `--group build` to get PyInstaller.
dev = [
  "ruff",
  "black",
  "pytest",
]
build = [
  "pyinstaller>=6.20.0",
]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
