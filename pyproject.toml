[project]
name = "datafaf"
version = "2.0.0"
description = "DataFab: wafer database generator (GDS -> JSON) and wafer map with Keithley 2450 live measurement (Qt)"
readme = "README.md"
requires-python = ">=3.12"

# Direct runtime deps inferred from your scripts
dependencies = [
  "numpy",
  "gdsfactory",
  "klayout",                      # provides the `klayout.db` module
  "pyside6-essentials",           # Qt GUI
  "pyqtgraph",                    # fast wafer map + live plot
  "pyvisa",
  "pyvisa-py",                    # pure-Python VISA backend (Linux, no NI-VISA needed)
  "pyusb",                        # USB-TMC for pyvisa-py
  "pyserial",
]

[dependency-groups]
# `uv sync` installs "dev" by default; add `--group build` to get PyInstaller.
dev = [
  "ruff",
  "black",
  "pytest",
]
build = [
  "pyinstaller>=6.20.0",
]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
